services:
  postgres:
    image: postgres:13-alpine
    restart: always
    profiles: ["app"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:6-alpine
    restart: always
    profiles: ["app"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
      args:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
    restart: always
    profiles: ["app"]
    environment:
      - OLLAMA_HOST=http://opencode:${OLLAMA_PORT:-11434}
    volumes:
      - ../php:/var/www/html
    networks:
      - app-network
    user: "${PUID:-1000}:${PGID:-1000}"

  nginx:
    image: nginx:1.21-alpine
    restart: always
    profiles: ["app"]
    ports:
      - "80:80"
    volumes:
      - ../php:/var/www/html
      - ${COMPOSE_PROJECT_PATH:-.}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  opencode:
    build:
      context: .
      dockerfile: opencode/Dockerfile
      args:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
    container_name: opencode-client
    profiles: ["app"]
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ollama_data:/home/opencodeuser/.ollama
      - opencode_config:/home/opencodeuser/.config/opencode
    ports:
      - "11434:11434"
    networks:
      - app-network
    tty: true
    stdin_open: true

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  opencode_config:
